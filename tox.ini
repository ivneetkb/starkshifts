[tox]
minversion = 3.11.0
envlist = py311, py312, flake8, mypy, black
isolated_build = true

[gh-actions]
python =
    3.12: py312, mypy, black
    3.11: py311, black

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:flake8]
basepython = python3.12
deps = flake8
commands = flake8 src tests

[testenv:mypy]
basepython = python3.12
deps =
    -r{toxinidir}/requirements_dev.txt
commands = mypy src

[testenv:black]
basepython = python3.12
deps = black
commands = black --check src tests